nc: 80  # number of classes
scales: 
  # [depth, width, max_channels]
  n: [1.0, 1.0, 576] 

# LeYOLO Nano backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, mn_conv, [16, 3, 2, "SI"]]  
  - [-1, 1, mn_conv, [16, 1, 1, "SI"]]
  - [-1, 1, MobileNetV4_BLOCK, [16, 3, 16, False, "SI", 2, False]]   
  - [-1, 1, MobileNetV4_BLOCK, [32, 3, 96, False, "SI", 2]]  
  - [-1, 1, MobileNetV4_BLOCK, [32, 3, 96, False, "SI", 1]]
  - [-1, 1, MobileNetV4_BLOCK, [64, 5, 96, True, "SI", 2]] 
  - [-1, 1, MobileNetV4_BLOCK, [64, 5, 192, True, "SI", 1]]
  - [-1, 1, MobileNetV4_BLOCK, [64, 5, 192, True, "SI", 1]]
  - [-1, 1, MobileNetV4_BLOCK, [64, 5, 192, True, "SI", 1]]
  - [-1, 1, MobileNetV4_BLOCK, [64, 5, 192, True, "SI", 1]]
  - [-1, 1, MobileNetV4_BLOCK, [96, 5, 576, True, "SI", 2]]
  - [-1, 1, MobileNetV4_BLOCK, [96, 5, 576, True, "SI", 1]]
  - [-1, 1, MobileNetV4_BLOCK, [96, 5, 576, True, "SI", 1]]
  - [-1, 1, MobileNetV4_BLOCK, [96, 5, 576, True, "SI", 1]]
  - [-1, 1, SPPF, [96, 5]]                           
  
# LeYOLO Nano head with C2f modules
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 9], 1, Concat, [1]]  # cat backbone P4
  - [-1, 1, MobileNetC2f, [64, 3, True]]  # Replace 3 MobileNetV3_BLOCKs with a single C2f module

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 1, MobileNetC2f, [32, 3, True]]  # Replace 3 MobileNetV3_BLOCKs with a single C2f module

  - [-1, 1, mn_conv, [64, 3, 2, "SI"]]
  - [[-1, 17], 1, Concat, [1]]  # cat head P4 (index adjusted)
  - [-1, 1, MobileNetC2f, [64, 3, True]]  # Replace 3 MobileNetV3_BLOCKs with a single C2f module

  - [-1, 1, mn_conv, [96, 3, 2, "SI"]]
  - [[-1, 14], 1, Concat, [1]]  # cat head P5 (original reference preserved)
  - [-1, 1, MobileNetC2f, [96, 3, True]]  # Replace 3 MobileNetV3_BLOCKs with a single C2f module

  - [[20, 23, 26], 1, Detect, [nc]]  # Detect(P3, P4, P5) - indices adjusted for new layer count