nc: 80  
scales: 
  
  n: [1.0, 1.0, 576] 

# ziLeYOLO Nano backbone
backbone:
  
  - [-1, 1, mn_conv, [16, 3, 2, "SI"]]  
  - [-1, 1, mn_conv, [16, 1, 1, "SI"]]
  - [-1, 1, EfficientMobileNetBlock, [16, 3, 16, False, "SI", 2, False]]   
  - [-1, 1, EfficientMobileNetBlock, [32, 3, 96, False, "SI", 2]]  
  - [-1, 1, EfficientMobileNetBlock, [32, 3, 96, False, "SI", 1]]
  - [-1, 1, EfficientMobileNetBlock, [64, 5, 96, True, "SI", 2]] 
  - [-1, 1, EfficientMobileNetBlock, [64, 5, 192, True, "SI", 1]]
  - [-1, 1, EfficientMobileNetBlock, [64, 5, 192, True, "SI", 1]]
  - [-1, 1, EfficientMobileNetBlock, [64, 5, 192, True, "SI", 1]]
  - [-1, 1, EfficientMobileNetBlock, [64, 5, 192, True, "SI", 1]]
  - [-1, 1, EfficientMobileNetBlock, [96, 5, 576, True, "SI", 2]]
  - [-1, 1, EfficientMobileNetBlock, [96, 5, 576, True, "SI", 1]]
  - [-1, 1, EfficientMobileNetBlock, [96, 5, 576, True, "SI", 1]]
  - [-1, 1, EfficientMobileNetBlock, [96, 5, 576, True, "SI", 1]]
  - [-1, 1, SPPF, [96, 5]]                           
  
# ziLeYOLO Nano head with MobileNetC2f modules
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 9], 1, Concat, [1]]  # cat backbone P4
  - [-1, 1, MobileNetC2f, [64, 3, True]]  

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 1, MobileNetC2f, [32, 3, True]]  

  - [-1, 1, mn_conv, [64, 3, 2, "SI"]]
  - [[-1, 17], 1, Concat, [1]]  # cat head 
  - [-1, 1, MobileNetC2f, [64, 3, True]]  

  - [-1, 1, mn_conv, [96, 3, 2, "SI"]]
  - [[-1, 14], 1, Concat, [1]]  # cat head P5 
  - [-1, 1, MobileNetC2f, [96, 3, True]]  

  - [[20, 23, 26], 1, Detect, [nc]]  # Detect(P3, P4, P5) 